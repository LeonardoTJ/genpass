name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.14']
        encryption: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=8,<9' 'ruff>=0.5,<0.6' build
      - if: ${{ !matrix.encryption }}
        run: python -m pip install .
      - if: ${{ matrix.encryption }}
        run: python -m pip install '.[encryption]'
      - run: python -m pytest
      - run: ruff check genpass tests packaging
      - run: python -m build
      - run: python packaging/smoke_wheel.py dist/*.whl dist/*.tar.gz
